<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Spotify Music Search</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container mt-4"></div>
        <h1 class="text-center">Spotify Music Search</h1>
        <p class="text-center">Search for songs using the Spotify Web API.</p>
        <button id="loginBtn" class="btn btn-success">Login with Spotify</button>
        <input id="searchInput" type="text" class="form-control" placeholder="Enter a song name">
        <button id="searchBtn" class="btn btn-primary">Search</button>
        <div id="message"></div>
        <div id="results"></div>
        <script src="script.js"></script>
    </body>
</html>
