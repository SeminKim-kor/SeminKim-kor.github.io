<!DOCTYPE html>
<html>
    <head>
        <title>Spotify Music Search</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container mt-4">
            <h1 class="text-center">Spotify Music Search</h1>
            <p class="text-center">Search for songs using the Spotify Web API.</p>
            <button class="btn btn-success" onclick="login()">Login with Spotify</button>
            <input id="searchInput" type="text" class="form-control" placeholder="Enter a song name">
            <button class="btn btn-primary" onclick="searchSong()">Search</button>
            <div id="message"></div>
            <div id="results"></div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
